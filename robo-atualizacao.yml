# HOCVOLTBR — atualiza a base Brasil todo dia às 23h59 (horário de Brasília) e publica o site.
name: Atualizar base diária e publicar site

on:
  schedule:
    - cron: "59 2 * * *"   # 02:59 UTC = 23:59 em Brasília (todos os dias, 7 dias por semana)
  workflow_dispatch:         # botão "Run workflow" para atualizar na hora
    inputs:
      pular_varredura:
        description: "Só publicar o site agora, sem varrer os estados"
        type: boolean
        default: false
  push:
    branches: [main]         # publica de novo sempre que você alterar o site
    paths:
      - "index.html"
      - "privacidade.html"
      - "manifest.webmanifest"
      - "icons/**"
      - "scripts/**"
      - ".github/workflows/atualizar-base.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hocvoltbr
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Fonte principal: o mapa completo do Brasil (Geofabrik, atualizado diariamente a partir do OpenStreetMap).
      # Não depende dos servidores Overpass, que vivem sobrecarregados. Se falhar, o script usa o Overpass.
      - name: Baixar o mapa do Brasil e separar postos
        if: ${{ !inputs.pular_varredura }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          pip install -q shapely || echo "shapely indisponível: usa cálculo simples"
          curl -fsSL --retry 3 --retry-delay 20 -o /tmp/brasil.osm.pbf \
            https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
          ls -la /tmp/brasil.osm.pbf
          osmium tags-filter /tmp/brasil.osm.pbf \
            nwr/amenity=charging_station,fuel,parking nwr/shop=mall,supermarket,department_store \
            -o /tmp/filtro.osm.pbf -O
          rm -f /tmp/brasil.osm.pbf
          osmium export /tmp/filtro.osm.pbf -f geojsonseq -u type_id -o /tmp/postos.geojsonseq -O
          ls -la /tmp/postos.geojsonseq

      - name: Varrer o Brasil e montar a base
        if: ${{ !inputs.pular_varredura }}
        continue-on-error: true      # se a varredura falhar, o site é publicado mesmo assim (com a base anterior)
        timeout-minutes: 150
        env:
          OCM_KEY: ${{ secrets.OCM_KEY }}
          OSM_GEOJSONSEQ: /tmp/postos.geojsonseq
        run: python scripts/atualizar_base.py

      - name: Salvar a base no repositório (se mudou)
        run: |
          git config user.name  "hocvoltbr-bot"
          git config user.email "hocvoltbr-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem mudanças hoje."
          else
            git commit -m "Base atualizada em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Separar só os arquivos do site
        env:
          OCM_KEY: ${{ secrets.OCM_KEY }}
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest _site/
          [ -f privacidade.html ] && cp privacidade.html _site/
          cp -r icons data _site/
          # Chave do Open Charge Map (se cadastrada) vale para todos que abrirem o site
          python3 - <<'PY'
          import os, re
          k = (os.environ.get("OCM_KEY") or "").strip()
          if k and re.fullmatch(r"[A-Za-z0-9-]{8,80}", k):
              p = "_site/index.html"
              s = open(p, encoding="utf-8").read()
              s = s.replace('const OCM_KEY_DEFAULT = "";', 'const OCM_KEY_DEFAULT = "%s";' % k, 1)
              open(p, "w", encoding="utf-8").write(s)
              print("Chave OCM aplicada ao site.")
          else:
              print("Sem chave OCM: site usa só OpenStreetMap + verificados.")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
